[package]
name = "relaxng-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = true
description = "Production-oriented RELAX NG XML schema parsing and validation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faizanali2k05/relaxng-rs"
documentation = "https://docs.rs/relaxng-rs"
keywords = ["relax-ng", "xml", "schema", "validation"]
categories = ["parser-implementations"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
relaxng-model = { path = "../relaxng-model", version = "0.1.0" }
relaxng-syntax = { path = "../relaxng-syntax", version = "0.1.0" }
relaxng-validator = { path = "../relaxng-validator", version = "0.1.0" }
